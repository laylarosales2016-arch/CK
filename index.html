<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chowking Remote Queue Caller Receiver</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0b1329;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 650px;
            background-color: #131c38;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid #1a2750;
            text-align: center;
        }
        h1 {
            font-size: 22px;
            color: #a5b4fc;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .config-box {
            background-color: #1b264f;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
            text-align: left;
        }
        .config-box label {
            font-size: 12px;
            color: #94a3b8;
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
            margin-top: 10px;
        }
        .config-box label:first-child {
            margin-top: 0;
        }
        .config-box input[type="text"],
        .config-box input[type="password"],
        .config-box select {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #2a3b75;
            background-color: #0b1329;
            color: #ffffff;
            font-size: 13px;
        }
        .config-box input[type="range"] {
            width: 100%;
            accent-color: #8b79ff;
            cursor: pointer;
        }
        .btn {
            background: linear-gradient(135deg, #8b79ff, #6a4dff);
            color: #ffffff;
            border: none;
            padding: 12px 20px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
            transition: all 0.2s;
        }
        .btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }
        .display-card {
            background: linear-gradient(135deg, #8b79ff, #6a4dff);
            border-radius: 20px;
            padding: 25px;
            margin-top: 20px;
            min-height: 220px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 8px 25px rgba(106,77,255,0.3);
        }
        .badge-row {
            display: flex;
            justify-content: space-between;
            width: 100%;
        }
        .badge {
            background: rgba(0, 0, 0, 0.3);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 0.5px;
        }
        .number-display {
            font-size: 90px;
            font-weight: bold;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.4);
            margin: 10px 0;
        }
        .spoken-text {
            font-size: 14px;
            color: #e2e8f0;
            font-style: italic;
            max-width: 90%;
        }
        .status-bar {
            margin-top: 15px;
            font-size: 12px;
            color: #38bdf8;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🎙️ Chowking Remote Queue Receiver</h1>

        <div class="config-box">
            <label for="supabaseUrl">Supabase Project URL:</label>
            <input type="text" id="supabaseUrl" value="https://mluffwjvkbekyaslrxnz.supabase.co">

            <label for="anonKey">Supabase Anon Key:</label>
            <input type="password" id="anonKey" value="sb_publishable_mszkB4HRPo-vRhxQOXgUZw_Aprw6Z9y">

            <label for="voiceSelect">Select Speech Voice Engine:</label>
            <select id="voiceSelect">
                <option value="">Auto-Detect English Voice</option>
            </select>

            <div style="display: flex; gap: 12px; margin-top: 10px;">
                <div style="flex: 1;">
                    <label for="speedInput" style="margin-top: 0;">Speech Speed: <span id="speedVal">1.0</span>x</label>
                    <input type="range" id="speedInput" min="0.5" max="2.0" step="0.1" value="1.0" oninput="document.getElementById('speedVal').innerText = this.value">
                </div>
                <div style="flex: 1;">
                    <label for="pitchInput" style="margin-top: 0;">Voice Pitch: <span id="pitchVal">1.0</span>x</label>
                    <input type="range" id="pitchInput" min="0.5" max="2.0" step="0.1" value="1.0" oninput="document.getElementById('pitchVal').innerText = this.value">
                </div>
            </div>

            <div style="display: flex; align-items: center; justify-content: space-between; margin-top: 12px; background: #0b1329; padding: 12px 14px; border-radius: 10px; border: 1px solid #2a3b75;">
                <div>
                    <label style="margin: 0; cursor: pointer; color: #ffffff; font-size: 13px;" for="boostToggle">🔊 Volume Boost (Extra Loud Mode)</label>
                    <div style="font-size: 10px; color: #94a3b8; margin-top: 2px;">Amplifies speech &amp; audio for speakers and TVs</div>
                </div>
                <input type="checkbox" id="boostToggle" checked style="width: 20px; height: 20px; cursor: pointer; accent-color: #8b79ff;">
            </div>

            <button class="btn" id="btnConnect" onclick="startListening()">⚡ Connect Supabase &amp; Enable Voice</button>
        </div>

        <div class="display-card">
            <div class="badge-row">
                <span class="badge" id="badgeType">WAITING FOR COMMANDS</span>
                <span class="badge">REMOTE RECEIVER</span>
            </div>

            <div class="number-display" id="displayNumber">000</div>

            <div class="spoken-text" id="displayText">Ready to speak announcements and play birthday songs remotely...</div>
        </div>

        <div class="status-bar" id="statusText">Status: Disconnected. Tap Connect button above to start.</div>
    </div>

    <script>
        let lastTimestamp = 0;
        let pollInterval = null;
        let audioCtx = null;
        let birthdayPlaying = false;
        let activeToneOscillators = [];

        function loadBrowserVoices() {
            const voiceSelect = document.getElementById('voiceSelect');
            const voices = window.speechSynthesis.getVoices();
            if (!voices || voices.length === 0) return;

            voiceSelect.innerHTML = '<option value="">Auto-Detect English Voice</option>';
            voices.forEach((v, idx) => {
                const opt = document.createElement('option');
                opt.value = idx;
                opt.innerText = `${v.name} (${v.lang})`;
                if (v.default || v.name.includes('Google') || v.name.includes('Natural')) {
                    opt.selected = true;
                }
                voiceSelect.appendChild(opt);
            });
        }

        window.speechSynthesis.onvoiceschanged = loadBrowserVoices;
        loadBrowserVoices();

        function startListening() {
            let supabaseUrl = document.getElementById('supabaseUrl').value.trim();
            let anonKey = document.getElementById('anonKey').value.trim();

            if (!supabaseUrl || !anonKey) {
                alert('Please enter your Supabase Project URL and Anon Key!');
                return;
            }

            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            window.speechSynthesis.cancel();
            const unlockUtterance = new SpeechSynthesisUtterance('Remote voice and birthday audio output connected.');
            window.speechSynthesis.speak(unlockUtterance);

            document.getElementById('statusText').innerText = 'Status: Connected to Supabase! Listening...';
            document.getElementById('statusText').style.color = '#22c55e';

            if (pollInterval) clearInterval(pollInterval);
            pollInterval = setInterval(() => checkSupabase(supabaseUrl, anonKey), 800);
            checkSupabase(supabaseUrl, anonKey);
        }

        async function checkSupabase(supabaseUrl, anonKey) {
            try {
                let cleanUrl = supabaseUrl.trim();
                if (!cleanUrl.endsWith('/')) cleanUrl += '/';
                const endpoint = cleanUrl + 'rest/v1/queue?select=*&order=timestamp.desc&limit=1';

                const response = await fetch(endpoint, {
                    headers: {
                        'apikey': anonKey,
                        'Authorization': 'Bearer ' + anonKey
                    }
                });

                if (!response.ok) {
                    document.getElementById('statusText').innerText = 'Status Notice: Connecting... (' + response.status + ')';
                    document.getElementById('statusText').style.color = '#f59e0b';
                    return;
                }

                document.getElementById('statusText').innerText = 'Status: Connected to Supabase & Listening...';
                document.getElementById('statusText').style.color = '#22c55e';

                const rows = await response.json();
                if (rows && rows.length > 0) {
                    const payload = rows[0];
                    if (payload && payload.timestamp && payload.timestamp > lastTimestamp) {
                        lastTimestamp = payload.timestamp;
                        triggerRemoteAnnouncement(payload);
                    }
                }
            } catch (err) {
                document.getElementById('statusText').innerText = 'Status Notice: Retrying connection...';
                document.getElementById('statusText').style.color = '#f59e0b';
            }
        }

        function playBirthdayMelody() {
            stopBirthdayMelody();
            birthdayPlaying = true;

            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }

            const isBoosted = document.getElementById('boostToggle').checked;
            const gainVolume = isBoosted ? 0.8 : 0.3;

            const notes = [
                { f: 264, d: 0.35 }, { f: 264, d: 0.35 }, { f: 297, d: 0.7 }, { f: 264, d: 0.7 }, { f: 352, d: 0.7 }, { f: 330, d: 1.2 },
                { f: 264, d: 0.35 }, { f: 264, d: 0.35 }, { f: 297, d: 0.7 }, { f: 264, d: 0.7 }, { f: 396, d: 0.7 }, { f: 352, d: 1.2 },
                { f: 264, d: 0.35 }, { f: 264, d: 0.35 }, { f: 528, d: 0.7 }, { f: 440, d: 0.7 }, { f: 352, d: 0.7 }, { f: 330, d: 0.7 }, { f: 297, d: 1.0 },
                { f: 466, d: 0.35 }, { f: 466, d: 0.35 }, { f: 440, d: 0.7 }, { f: 352, d: 0.7 }, { f: 396, d: 0.7 }, { f: 352, d: 1.5 }
            ];

            let currTime = audioCtx.currentTime + 0.1;
            notes.forEach(n => {
                if (!birthdayPlaying) return;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.type = 'triangle';
                osc.frequency.setValueAtTime(n.f, currTime);

                gain.gain.setValueAtTime(gainVolume, currTime);
                gain.gain.exponentialRampToValueAtTime(0.001, currTime + n.d);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start(currTime);
                osc.stop(currTime + n.d);
                activeToneOscillators.push(osc);

                currTime += n.d + 0.05;
            });
        }

        function stopBirthdayMelody() {
            birthdayPlaying = false;
            activeToneOscillators.forEach(osc => {
                try { osc.stop(); } catch(e) {}
            });
            activeToneOscillators = [];
        }

        function triggerRemoteAnnouncement(payload) {
            document.getElementById('displayNumber').innerText = payload.number || '0';
            document.getElementById('displayText').innerText = payload.text || '';
            document.getElementById('badgeType').innerText = (payload.type || 'ORDER').toUpperCase();

            // Handle Birthday Command
            if (payload.type === 'BIRTHDAY' || payload.action === 'birthday_play') {
                if (payload.action === 'stop' || payload.action === 'birthday_stop') {
                    stopBirthdayMelody();
                } else {
                    playBirthdayMelody();
                }
                return;
            } else {
                stopBirthdayMelody();
            }

            // Speak Speech Announcement
            if (payload.text) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(payload.text);

                // Read Speech Speed, Pitch, and Volume Boost directly from Web Sliders
                const userSpeed = parseFloat(document.getElementById('speedInput').value);
                const userPitch = parseFloat(document.getElementById('pitchInput').value);
                const isBoosted = document.getElementById('boostToggle').checked;

                utterance.rate = !isNaN(userSpeed) ? userSpeed : 1.0;
                utterance.pitch = !isNaN(userPitch) ? userPitch : 1.0;
                utterance.volume = isBoosted ? 1.0 : 0.8;

                const voices = window.speechSynthesis.getVoices();
                const selectedIdx = document.getElementById('voiceSelect').value;

                if (selectedIdx !== "" && voices[selectedIdx]) {
                    utterance.voice = voices[selectedIdx];
                } else {
                    const enVoice = voices.find(v => v.lang.startsWith('en'));
                    if (enVoice) utterance.voice = enVoice;
                }

                window.speechSynthesis.speak(utterance);
            }
        }
    </script>
</body>
</html>
