<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chowking Remote Queue Caller Receiver</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0b1329;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background-color: #131c38;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid #1a2750;
            text-align: center;
        }
        h1 {
            font-size: 22px;
            color: #a5b4fc;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .config-box {
            background-color: #1b264f;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 25px;
            text-align: left;
        }
        .config-box label {
            font-size: 12px;
            color: #94a3b8;
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
        }
        .config-box input {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #2a3b75;
            background-color: #0b1329;
            color: #ffffff;
            font-size: 13px;
            margin-bottom: 10px;
        }
        .btn {
            background: linear-gradient(135deg, #8b79ff, #6a4dff);
            color: #ffffff;
            border: none;
            padding: 12px 20px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            transition: all 0.2s;
        }
        .btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }
        .display-card {
            background: linear-gradient(135deg, #8b79ff, #6a4dff);
            border-radius: 20px;
            padding: 25px;
            margin-top: 20px;
            min-height: 220px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 8px 25px rgba(106,77,255,0.3);
        }
        .badge-row {
            display: flex;
            justify-content: space-between;
            width: 100%;
        }
        .badge {
            background: rgba(0, 0, 0, 0.3);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 0.5px;
        }
        .number-display {
            font-size: 90px;
            font-weight: bold;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.4);
            margin: 10px 0;
        }
        .spoken-text {
            font-size: 14px;
            color: #e2e8f0;
            font-style: italic;
            max-width: 90%;
        }
        .status-bar {
            margin-top: 15px;
            font-size: 12px;
            color: #38bdf8;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🎙️ Chowking Remote Queue Receiver</h1>

        <div class="config-box">
            <label for="supabaseUrl">Supabase Project URL:</label>
            <input type="text" id="supabaseUrl" placeholder="https://YOUR_PROJECT_REF.supabase.co">

            <label for="anonKey">Supabase Anon Key:</label>
            <input type="password" id="anonKey" placeholder="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...">

            <button class="btn" id="btnConnect" onclick="startListening()">⚡ Connect Supabase &amp; Enable Voice</button>
        </div>

        <div class="display-card">
            <div class="badge-row">
                <span class="badge" id="badgeType">WAITING FOR COMMANDS</span>
                <span class="badge">REMOTE RECEIVER</span>
            </div>

            <div class="number-display" id="displayNumber">000</div>

            <div class="spoken-text" id="displayText">Ready to speak announcements remotely...</div>
        </div>

        <div class="status-bar" id="statusText">Status: Disconnected. Enter Supabase URL and Anon Key above to start.</div>
    </div>

    <script>
        let lastTimestamp = 0;
        let pollInterval = null;

        function startListening() {
            let supabaseUrl = document.getElementById('supabaseUrl').value.trim();
            let anonKey = document.getElementById('anonKey').value.trim();

            if (!supabaseUrl || !anonKey) {
                alert('Please enter your Supabase Project URL and Anon Key!');
                return;
            }

            window.speechSynthesis.cancel();
            const unlockUtterance = new SpeechSynthesisUtterance('Supabase realtime voice output connected.');
            window.speechSynthesis.speak(unlockUtterance);

            document.getElementById('statusText').innerText = 'Status: Connected to Supabase! Listening...';
            document.getElementById('statusText').style.color = '#22c55e';

            if (pollInterval) clearInterval(pollInterval);
            pollInterval = setInterval(() => checkSupabase(supabaseUrl, anonKey), 800);
            checkSupabase(supabaseUrl, anonKey);
        }

        async function checkSupabase(supabaseUrl, anonKey) {
            try {
                let cleanUrl = supabaseUrl.trim();
                if (!cleanUrl.endsWith('/')) cleanUrl += '/';
                const endpoint = cleanUrl + 'rest/v1/queue?select=*&order=timestamp.desc&limit=1';

                const response = await fetch(endpoint, {
                    headers: {
                        'apikey': anonKey,
                        'Authorization': 'Bearer ' + anonKey
                    }
                });

                if (!response.ok) {
                    document.getElementById('statusText').innerText = 'Status Notice: Connecting... (' + response.status + ')';
                    document.getElementById('statusText').style.color = '#f59e0b';
                    return;
                }

                document.getElementById('statusText').innerText = 'Status: Connected to Supabase & Listening...';
                document.getElementById('statusText').style.color = '#22c55e';

                const rows = await response.json();
                if (rows && rows.length > 0) {
                    const payload = rows[0];
                    if (payload && payload.timestamp && payload.timestamp > lastTimestamp) {
                        lastTimestamp = payload.timestamp;
                        triggerRemoteAnnouncement(payload);
                    }
                }
            } catch (err) {
                document.getElementById('statusText').innerText = 'Status Notice: Retrying connection...';
                document.getElementById('statusText').style.color = '#f59e0b';
            }
        }

        function triggerRemoteAnnouncement(payload) {
            document.getElementById('displayNumber').innerText = payload.number || '0';
            document.getElementById('displayText').innerText = payload.text || '';
            document.getElementById('badgeType').innerText = (payload.type || 'ORDER').toUpperCase();

            if (payload.text) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(payload.text);
                utterance.rate = payload.speed || 1.0;
                utterance.pitch = payload.pitch || 1.0;

                const voices = window.speechSynthesis.getVoices();
                const enVoice = voices.find(v => v.lang.startsWith('en'));
                if (enVoice) utterance.voice = enVoice;

                window.speechSynthesis.speak(utterance);
            }
        }
    </script>
</body>
</html>
